<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - SisKeu MTs Al-Fatah</title>
  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-color: #f4f6f9;
      --sidebar-width: 250px;
      --card-bg: #ffffff;
      --text-main: #333333;
      --border-color: #dee2e6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      background-color: #212529;
      color: white;
      position: fixed;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .sidebar-header {
      padding: 20px;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #373b3e;
      text-align: center;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
      flex-grow: 1;
    }

    .sidebar-menu li a {
      display: block;
      padding: 15px 20px;
      color: #adb5bd;
      text-decoration: none;
      transition: 0.2s;
    }

    .sidebar-menu li.active a, .sidebar-menu li a:hover {
      background-color: #343a40;
      color: white;
    }

    .sidebar-footer {
      padding: 20px;
      border-top: 1px solid #373b3e;
    }

    .btn-logout {
      width: 100%;
      padding: 10px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-logout:hover {
      background-color: #bb2d3b;
    }

    /* Main Content */
    .main-content {
      margin-left: var(--sidebar-width);
      flex-grow: 1;
      padding: 30px;
      box-sizing: border-box;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header-top h1 {
      margin: 0;
      font-size: 24px;
      color: var(--text-main);
    }

    /* Cards Info */
    .info-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .info-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      border-left: 5px solid var(--primary-color);
    }

    .info-card h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #6c757d;
    }

    .info-card .number {
      font-size: 24px;
      font-weight: bold;
      color: var(--text-main);
    }

    /* Section Tabel Akun */
    .card-section {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-add {
      padding: 10px 15px;
      background-color: #198754;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-add:hover {
      background-color: #157347;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    th {
      background-color: #f8f9fa;
      color: #495057;
      font-weight: 600;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-admin { background: #cfe2ff; color: #084298; }
    .badge-walikelas { background: #fff3cd; color: #664d03; }
    .badge-siswa { background: #d1e7dd; color: #0f5132; }

    /* Modal Tambah Akun */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-cancel { background: #6c757d; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
    .btn-save { background: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div>
      <div class="sidebar-header">SisKeu Admin</div>
      <ul class="sidebar-menu">
        <li class="active"><a href="#">📊 Manajemen Akun</a></li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">Keluar</button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header-top">
      <h1>Dashboard Administrator</h1>
      <span id="adminNameLabel" style="font-weight: 600; color: #555;"></span>
    </div>

    <!-- Ringkasan Kartu -->
    <div class="info-cards">
      <div class="info-card">
        <h3>Total Pengguna</h3>
        <div class="number" id="totalUsers">-</div>
      </div>
    </div>

    <!-- Tabel Pengguna -->
    <div class="card-section">
      <div class="section-header">
        <h3 style="margin:0;">Daftar Akun Pengguna</h3>
        <button class="btn-add" onclick="openModal()">+ Tambah Akun</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Role</th>
            <th>ID Login / NISN / PegID</th>
            <th>Nama Lengkap</th>
            <th>Kelas</th>
          </tr>
        </thead>
        <tbody id="tableAkunBody">
          <tr><td colspan="4" style="text-align: center;">Memuat data dari server...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Tambah Akun -->
  <div class="modal" id="modalTambah">
    <div class="modal-content">
      <h3>Tambah Akun Baru</h3>
      <form id="formTambahAkun">
        <div class="form-group">
          <label>Role</label>
          <select id="addRole" required>
            <option value="Admin">Admin</option>
            <option value="Walikelas">Wali Kelas</option>
            <option value="Siswa">Siswa</option>
          </select>
        </div>
        <div class="form-group">
          <label>ID Login / NISN / PegID</label>
          <input type="text" id="addId" required placeholder="Contoh: 0012345 atau admin">
        </div>
        <div class="form-group">
          <label>Password (Wajib untuk Admin)</label>
          <input type="password" id="addPass" placeholder="Kosongkan jika bukan admin">
        </div>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="addNama" required placeholder="Nama lengkap pengguna">
        </div>
        <div class="form-group">
          <label>Kelas (Opsional untuk Admin)</label>
          <input type="text" id="addKelas" placeholder="Contoh: 7A">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
          <button type="submit" class="btn-save" id="btnSaveAkun">Simpan</button>
        </div>
      </form>
    </div>
  </div>

<script>
  // URL Web App Google Apps Script Anda
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzneHDGHeaJrXWBbbGL4Vz_5LXp2hpU4kV3DGtDTWoErUCHBZ9wbTpZkOvO1dBodObPPA/exec';

  // Cek sesi login saat halaman dibuka
  const session = JSON.parse(localStorage.getItem('userSession'));
  if (!session || session.role !== 'Admin') {
    alert('Akses ditolak! Silakan login terlebih dahulu sebagai Admin.');
    window.location.href = 'index.html';
  } else {
    document.getElementById('adminNameLabel').textContent = `Halo, ${session.nama}`;
    loadDataAkun();
  }

  function logout() {
    localStorage.removeItem('userSession');
    window.location.href = 'index.html';
  }

  // Fungsi mengambil data akun dari server
  function loadDataAkun() {
    fetch(scriptURL + '?action=getAccounts')
    .then(res => res.json())
    .then(data => {
      const tbody = document.getElementById('tableAkunBody');
      tbody.innerHTML = '';
      
      if(data.status === 'success') {
        document.getElementById('totalUsers').textContent = data.accounts.length;
        data.accounts.forEach(acc => {
          let badgeClass = 'badge-siswa';
          if(acc.role === 'Admin') badgeClass = 'badge-admin';
          else if(acc.role === 'Walikelas') badgeClass = 'badge-walikelas';

          tbody.innerHTML += `
            <tr>
              <td><span class="badge ${badgeClass}">${acc.role}</span></td>
              <td>${acc.id}</td>
              <td>${acc.nama}</td>
              <td>${acc.kelas || '-'}</td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">${data.message}</td></tr>`;
      }
    })
    .catch(err => {
      console.error(err);
      document.getElementById('tableAkunBody').innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Gagal memuat data.</td></tr>`;
    });
  }

  // Modal Control
  function openModal() { document.getElementById('modalTambah').style.display = 'flex'; }
  function closeModal() { document.getElementById('modalTambah').style.display = 'none'; }

  // Tambah Akun Handler
  document.getElementById('formTambahAkun').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSaveAkun');
    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    const payload = {
      action: 'addAccount',
      role: document.getElementById('addRole').value,
      id: document.getElementById('addId').value.trim(),
      password: document.getElementById('addPass').value.trim(),
      nama: document.getElementById('addNama').value.trim(),
      kelas: document.getElementById('addKelas').value.trim()
    };

    fetch(scriptURL, {
      method: 'POST',
      body: JSON.stringify(payload),
      redirect: 'follow'
    })
    .then(res => res.json())
    .then(data => {
      btn.disabled = false;
      btn.textContent = 'Simpan';
      if(data.status === 'success') {
        alert('Akun berhasil ditambahkan!');
        closeModal();
        document.getElementById('formTambahAkun').reset();
        loadDataAkun();
      } else {
        alert('Gagal: ' + data.message);
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.textContent = 'Simpan';
      alert('Terjadi kesalahan koneksi server.');
    });
  });
</script>

</body>
</html>
