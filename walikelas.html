<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Wali Kelas - MTs Al-Fatah</title>

  <!-- Tab Icon Browser -->
  <link rel="icon" href="mts.ico" type="image/x-icon">
  <link rel="shortcut icon" href="mts.ico" type="image/x-icon">

  <!-- Tag PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link rel="apple-touch-icon" href="logo-192.png">

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-header">🏫 Wali Kelas</div>
    <ul class="sidebar-menu">
      <div class="menu-label">Menu Kelas</div>
      <li class="nav-item-wk active" data-target="tagihan-kelas"><a href="#">📋 Tagihan Kelas</a></li>
      <li class="nav-item-wk" data-target="laporan-kelas"><a href="#">📊 Laporan Pembayaran</a></li>
    </ul>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">🚪 Keluar</button>
    </div>
  </div>

  <div class="main-content">
    <div class="header-top">
      <div style="display: flex; align-items: center; gap: 15px;">
        <button id="menuToggleWk" class="btn-menu">☰</button>
        <h1 id="pageTitleWk">Tagihan Kelas</h1>
      </div>
      <div>
        <span id="wkNameLabel" style="font-weight:600; margin-right:15px; font-size:14px;"></span>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- TAB TAGIHAN KELAS                          -->
    <!-- ========================================== -->
    <div id="tagihan-kelas" class="tab-content-wk active" style="display: block;">
      <h2>Data Tagihan Siswa Kelas <span id="label-kelas-tagihan" style="color:#0d6efd;"></span></h2>
      
      <div class="toolbar">
        <input type="text" class="search-input" id="search-wk-tagihan" placeholder="🔍 Cari nama siswa, NISN, atau jenis tagihan..." oninput="renderTagihanWalikelas()">
      </div>

      <div class="result-count" id="count-wk-tagihan"></div>

      <table>
        <thead>
          <tr>
            <th>NISN</th>
            <th>Nama Siswa</th>
            <th>Jenis Pembayaran</th>
            <th>Tarif</th>
            <th>Terbayar</th>
            <th>Sisa Tagihan</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody-wk-tagihan">
          <tr><td colspan="7" style="text-align: center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ========================================== -->
    <!-- TAB LAPORAN PEMBAYARAN KELAS               -->
    <!-- ========================================== -->
    <div id="laporan-kelas" class="tab-content-wk" style="display: none;">
      <div class="card-section">
        <div class="section-header">
          <h3>Riwayat Pembayaran Siswa Kelas <span id="label-kelas-laporan" style="color:#0d6efd;"></span></h3>
        </div>
        <div class="toolbar">
          <input type="text" class="search-input" id="search-wk-laporan" placeholder="🔍 Cari nama siswa, NISN..." oninput="renderLaporanWalikelas()">
          <label style="font-size:13px; font-weight:600; margin:0;">Dari</label>
          <input type="date" class="date-input" id="from-wk-laporan" onchange="renderLaporanWalikelas()">
          <label style="font-size:13px; font-weight:600; margin:0;">Sampai</label>
          <input type="date" class="date-input" id="to-wk-laporan" onchange="renderLaporanWalikelas()">
        </div>

        <div class="result-count" id="count-wk-laporan"></div>

        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Siswa</th>
              <th>Pembayaran</th>
              <th>Nominal</th>
              <th>Penerima</th>
            </tr>
          </thead>
          <tbody id="tbody-wk-laporan">
            <tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- External Script Aplikasi -->
  <script src="script.js"></script>
</body>
</html>
